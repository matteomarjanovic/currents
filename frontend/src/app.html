<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- interactive-widget differs per build target (see PUBLIC_INTERACTIVE_WIDGET in the
		     .env files): the web build uses resizes-visual so the keyboard scrolls the focused
		     input into view; the Capacitor build scripts override it to overlays-content because
		     the safe-area plugin resizes the webview natively and Chrome reacting too would
		     double-count the keyboard (grey band above it). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=%sveltekit.env.PUBLIC_INTERACTIVE_WIDGET%"
		/>
		<meta name="text-scale" content="scale" />
		<!-- Site-wide default; hooks.server.ts strips these on pages that set their own og:image
		     (e.g. blog posts) — this file can't be templated per-route, and this tag is the only
		     one most routes get at all, since they're client-only (ssr=false) and never execute
		     any component's <svelte:head>. -->
		<meta property="og:image" content="/currents_og_image.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="/currents_og_image.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Currents" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script
			defer
			src="https://mm-umami.netlify.app/script.js"
			data-website-id="d93794c5-c02d-4706-847c-a6f3f9cec4de"
		></script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
