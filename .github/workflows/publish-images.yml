name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA from main (defaults to the current main SHA)
        required: false
        type: string
      force_all:
        description: Publish every service (first release or recovery)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    name: Determine release services
    if: >-
      vars.SCW_REGISTRY != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.services.outputs.release_sha }}
      has_services: ${{ steps.services.outputs.has_services }}
      matrix: ${{ steps.services.outputs.matrix }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
      - id: services
        run: |
          if [ "${{ inputs.force_all }}" = true ]; then
            bash .github/scripts/release-services.sh "$RELEASE_SHA" --all
          else
            bash .github/scripts/release-services.sh "$RELEASE_SHA"
          fi

  publish:
    name: Publish ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
      - name: Validate release
        run: |
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') echo "release_sha must be a full lowercase commit SHA" >&2; exit 2 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          case "$SCW_REGISTRY" in
            rg.fr-par.scw.cloud/*) ;;
            *) echo "SCW_REGISTRY must be an fr-par namespace endpoint" >&2; exit 2 ;;
          esac
          case "$SCW_REGISTRY" in
            */) echo "SCW_REGISTRY must not end with a slash" >&2; exit 2 ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_REGISTRY_SECRET_KEY }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.SCW_REGISTRY }}/${{ matrix.image }}:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64
