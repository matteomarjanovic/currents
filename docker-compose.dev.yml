services:
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: appview
      POSTGRES_PASSWORD: appview
      POSTGRES_DB: appview
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appview -d appview"]
      interval: 5s
      timeout: 5s
      retries: 10

  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TAP_DATABASE_URL: postgres://appview:appview@db:5432/appview?sslmode=disable
      TAP_RELAY_URL: https://bsky.network
      TAP_COLLECTION_FILTERS: is.currents.*
      TAP_NO_REPLAY: "true"
      # Leave TAP_ADMIN_PASSWORD unset in dev: with it set, TAP's Basic auth also
      # covers /health and /repos/add, which tap-seed calls unauthenticated.
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD:-}
    ports:
      - "2480:2480"

  tap-seed:
    image: curlimages/curl:8.12.1
    restart: on-failure
    depends_on:
      tap:
        condition: service_started
    environment:
      TAP_URL: http://tap:2480
      TAP_DEV_HANDLES: ${TAP_DEV_HANDLES:-matteomarjanovic.com,zeroassembly.site}
      HANDLE_RESOLVER_URL: ${HANDLE_RESOLVER_URL:-https://public.api.bsky.app}
    volumes:
      - ./:/workspace:ro
    entrypoint: ["sh", "/workspace/seed-tap-handles.sh"]

  appview:
    build:
      context: ./appview
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tap:
        condition: service_started
      tap-seed:
        condition: service_started
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-changeme-use-a-strong-random-secret}
      COOKIE_SAME_SITE: none
      DATABASE_URL: postgres://appview:appview@db:5432/appview?sslmode=disable
      OAUTH_HOSTNAME: ${OAUTH_HOSTNAME:-api.currents.is}
      SERVICE_HOSTNAME: ${SERVICE_HOSTNAME:-api.currents.is}
      CLIENT_SECRET_KEY: ${CLIENT_SECRET_KEY:-}
      CLIENT_SECRET_KEY_ID: ${CLIENT_SECRET_KEY_ID:-primary}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.1.221:5173}
      TAP_URL: ws://tap:2480/channel
      TAP_ADMIN_URL: http://tap:2480
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD:-}
      INFERENCE_URL: http://host.docker.internal:8000
      HIDDEN_DIDS: ${HIDDEN_DIDS:-}
      LABELER_DID: ${LABELER_DID:-}
      LABELER_SIGNING_KEY: ${LABELER_SIGNING_KEY:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_SERVER: ${POLAR_SERVER:-sandbox}
    ports:
      - "8080:8080"

  clustering:
    build:
      context: ./clustering
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/models
    environment:
      DATABASE_URL: postgres://appview:appview@db:5432/appview?sslmode=disable
      MODELS_DIR: /models
      INFERENCE_URL: http://host.docker.internal:8000

volumes:
  pgdata:
