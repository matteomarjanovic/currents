# Production stack on a Scaleway Virtual Instance (see SCALEWAY_MIGRATION.md).
# Differences from docker-compose.mac-mini.yml:
#   - pgdata lives on a mounted Block Storage volume (/mnt/pgdata), not a named
#     volume, so the instance is disposable and the volume can be re-attached
#     to a bigger instance.
#   - Postgres gets real memory settings (the image default is 128MB
#     shared_buffers, sized for nothing) and publishes no port at all —
#     everything that needs it runs in this compose; ad-hoc psql goes over SSH.
#   - INFERENCE_URL points at the separate inference VM over the Scaleway
#     Private Network (no host.docker.internal on Linux).
#   - Clustering runs here, next to the DB, and publishes the monthly UMAP
#     model to the Object Storage model store; the inference VM syncs the
#     bucket on a timer (see SCALEWAY_MIGRATION.md). Its mem_limit
#     keeps the monthly UMAP fit from squeezing Postgres.

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: appview
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: appview
    volumes:
      - /mnt/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appview -d appview"]
      interval: 5s
      timeout: 5s
      retries: 10

  appview:
    build:
      context: ./appview
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tap:
        condition: service_started
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SAME_SITE: lax
      DATABASE_URL: postgres://appview:${DB_PASSWORD:?}@db:5432/appview?sslmode=disable
      OAUTH_HOSTNAME: ${OAUTH_HOSTNAME:-api.currents.is}
      SERVICE_HOSTNAME: ${SERVICE_HOSTNAME:-api.currents.is}
      CLIENT_SECRET_KEY: ${CLIENT_SECRET_KEY}
      CLIENT_SECRET_KEY_ID: ${CLIENT_SECRET_KEY_ID:-primary}
      FRONTEND_URL: ${FRONTEND_URL:-https://currents.is}
      CDN_URL: ${CDN_URL:-https://cdn.currents.is}
      TAP_URL: ws://tap:2480/channel
      TAP_ADMIN_URL: http://tap:2480
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD:-}
      INFERENCE_URL: ${INFERENCE_URL:?set to the inference VM private address, e.g. http://10.x.y.z:8000}
      HIDDEN_DIDS: ${HIDDEN_DIDS:-}
      LABELER_DID: ${LABELER_DID:-}
      LABELER_SIGNING_KEY: ${LABELER_SIGNING_KEY:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_SERVER: ${POLAR_SERVER:-production}

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_WEB_APPVIEW_URL: ""
        PUBLIC_POLAR_PRODUCT_MONTHLY: ${PUBLIC_POLAR_PRODUCT_MONTHLY:-}
        PUBLIC_POLAR_PRODUCT_YEARLY: ${PUBLIC_POLAR_PRODUCT_YEARLY:-}
    restart: unless-stopped
    depends_on:
      - appview
    environment:
      APPVIEW_INTERNAL_URL: http://appview:8080
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:-https://currents.is}
      PORT: 3000

  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TAP_DATABASE_URL: postgres://appview:${DB_PASSWORD:?}@db:5432/appview?sslmode=disable
      # Pinned to us-east on purpose — do NOT revert to the bsky.network
      # alias; see the note in docker-compose.mac-mini.yml history and
      # BACKLOG.md (relay1.us-west path incident, 2026-08-04).
      TAP_RELAY_URL: https://relay1.us-east.bsky.network
      TAP_SIGNAL_COLLECTION: is.currents.actor.profile
      TAP_COLLECTION_FILTERS: is.currents.*
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD:-}

  clustering:
    build:
      context: ./clustering
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The monthly UMAP fit peaks at a few GB; cap it so it can never OOM the
    # instance out from under Postgres.
    mem_limit: 3g
    volumes:
      - ./models:/models
    environment:
      DATABASE_URL: postgres://appview:${DB_PASSWORD:?}@db:5432/appview?sslmode=disable
      MODELS_DIR: /models
      MODELS_S3_ENDPOINT: https://s3.fr-par.scw.cloud
      MODELS_S3_BUCKET: ${MODELS_S3_BUCKET:?}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      AWS_DEFAULT_REGION: fr-par
      # INFERENCE_URL deliberately unset: the push-reload is dev-only. The
      # inference VM picks up published models via its bucket-sync timer.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - appview
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Phase A is the safe default. Set CADDYFILE=./Caddyfile.scaleway only at Cutover B.
      - type: bind
        source: ${CADDYFILE:-./Caddyfile.scaleway.phase-a}
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
